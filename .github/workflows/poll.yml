name: Poll AI Trials & Credits

on:
  schedule:
    # Run every 30 minutes (100% free with unlimited minutes on public repositories)
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  poll-and-notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit updated seen_deals.json state

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run Test Suite
        run: |
          python -m pytest -v

      - name: Run FreeTrialFinder Poller
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MIN_SCORE: 40
          STATE_FILE: data/seen_deals.json
        run: |
          python -m freetrialfinder.cli poll

      - name: Commit and Push State (Deduplication Persistence)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated: update seen deals deduplication cache [skip ci]"
          file_pattern: "data/seen_deals.json"
